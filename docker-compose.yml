# Postgres do painel. Este arquivo roda no VPS, em /opt/browns.
#
# A porta e publicada apenas em 127.0.0.1: o banco nao fica acessivel pela
# internet. Quem desenvolve chega nele por tunel SSH (npm run tunel).
#
# A senha vem do arquivo .env ao lado, gerado com openssl no proprio servidor.

name: browns

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: browns
      POSTGRES_PASSWORD: ${PG_SENHA}
      POSTGRES_DB: browns
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - dados:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U browns -d browns']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dados:
