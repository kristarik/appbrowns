# Producao. Roda no VPS em /opt/browns.
#
# O banco publica porta apenas em 127.0.0.1, entao nao esta acessivel pela
# internet. Quem fala com ele e o container do painel, pela rede interna do
# compose, e o desenvolvedor, por tunel SSH.

name: browns

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: browns
      POSTGRES_PASSWORD: ${PG_SENHA}
      POSTGRES_DB: browns
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - dados:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U browns -d browns']
      interval: 5s
      timeout: 5s
      retries: 10

  painel:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://browns:${PG_SENHA}@db:5432/browns?schema=public
      AUTH_SECRET: ${AUTH_SECRET}
      NODE_ENV: production
      # Define se o cookie de sessao sai marcado como Secure. Trocar para o
      # endereco https quando o dominio entrar, senao o login para de funcionar.
      SERVER_URL: ${SERVER_URL:-http://179.198.114.184:3000}

      # Google: leitura de Analytics, Search Console e Ads.
      GOOGLE_SA_KEY_PATH: /app/segredos/google-service-account.json
      GA4_PROPERTY_ID: ${GA4_PROPERTY_ID:-}
      GSC_SITE_URL: ${GSC_SITE_URL:-}
      GADS_DEVELOPER_TOKEN: ${GADS_DEVELOPER_TOKEN:-}
      GADS_CLIENT_ID: ${GADS_CLIENT_ID:-}
      GADS_CLIENT_SECRET: ${GADS_CLIENT_SECRET:-}
      GADS_CUSTOMER_ID: ${GADS_CUSTOMER_ID:-}
      # Vazio significa acesso direto a conta. Preenchido com a MCC, o Google
      # recusa com 403 quando a conta nao esta sob ela.
      GADS_LOGIN_CUSTOMER_ID: ${GADS_LOGIN_CUSTOMER_ID:-}
      GADS_REFRESH_TOKEN: ${GADS_REFRESH_TOKEN:-}

      # Chave que o agendamento usa para chamar /api/sincronizar.
      CRON_SECRET: ${CRON_SECRET:-}
    volumes:
      # Somente leitura e por fora da imagem, para o segredo nao viajar junto
      # caso a imagem seja copiada para outro lugar.
      - ../segredos:/app/segredos:ro
    ports:
      # So em 127.0.0.1: quem fala com o painel e o Caddy, que roda na propria
      # maquina e cuida do HTTPS. Sem isto, daria para acessar por
      # http://IP:3000 e contornar o certificado.
      - '127.0.0.1:3000:3000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  dados:
